<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Password API</title>
</head>
<body>
<pre id="output"></pre>

<script>
function generatePassword(length = 12) {
    const chars =
        "abcdefghijklmnopqrstuvwxyz" +
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
        "0123456789" +
        "!@#$%^&*_-+=";

    let password = "";

    crypto.getRandomValues(new Uint32Array(length)).forEach(num => {
        password += chars[num % chars.length];
    });

    return password;
}

const result = {
    password: generatePassword(12)
};

document.body.innerText = JSON.stringify(result);
</script>
</body>
</html>
